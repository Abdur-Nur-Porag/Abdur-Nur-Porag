<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>Abdur Nur Porag | Blog & Articles</title>

        <!-- Primary Meta Tags -->
        <meta
            name="description"
            content="Personal blog, technical notes, and articles by Abdur Nur Porag."
        />
        <meta name="author" content="Abdur Nur Porag" />

        <!-- Open Graph / Facebook Link Preview Tags -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://abdurnurporag.netlify.app/" />
        <meta property="og:title" content="Abdur Nur Porag | Blog & Articles" />
        <meta
            property="og:description"
            content="Personal blog, technical notes, and articles by Abdur Nur Porag."
        />
        <meta property="og:site_name" content="Abdur Nur Porag" />

        <!-- Fonts & Stylesheets -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
            rel="stylesheet"
        />

        <style>
            :root {
                /* Material Design Forest Green Palette */
                --md-sys-color-primary: #1b382b;
                --md-sys-color-primary-container: #d2ebd9;
                --md-sys-color-surface: #f7fbf6;
                --md-sys-color-on-surface: #181d19;
                --md-sys-color-on-surface-variant: #414942;
                --md-sys-color-surface-variant: #dde5dd;
            }

            * {
                box-sizing: border-box;
            }

            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                font-family: 'Roboto', sans-serif;
                background-color: var(--md-sys-color-surface);
                color: var(--md-sys-color-on-surface);
            }

            .iframe-container {
                position: relative;
                width: 100%;
                height: 100vh;
            }

            /* Loading Overlay Screen */
            .loading-screen {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                background-color: var(--md-sys-color-surface);
                z-index: 10;
                transition: opacity 0.4s ease, visibility 0.4s ease;
                gap: 16px;
            }

            .loading-text {
                font-size: 0.95rem;
                font-weight: 500;
                letter-spacing: 0.1px;
                color: var(--md-sys-color-on-surface-variant);
            }

            /* Material Design 3 Linear Progress Bar */
            .linear-progress {
                position: relative;
                width: 240px;
                height: 4px;
                background-color: var(--md-sys-color-surface-variant);
                border-radius: 2px;
                overflow: hidden;
            }

            .linear-progress .bar {
                position: absolute;
                background-color: var(--md-sys-color-primary);
                top: 0;
                bottom: 0;
                left: 0;
                will-change: left, right;
                animation: m3-linear-indeterminate 2.1s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite;
            }

            @keyframes m3-linear-indeterminate {
                0% {
                    left: -35%;
                    right: 100%;
                }
                60% {
                    left: 100%;
                    right: -90%;
                }
                100% {
                    left: 100%;
                    right: -90%;
                }
            }

            /* Clean Borderless iFrame */
            .blog-iframe {
                width: 100%;
                height: 100%;
                border: 0;
                outline: none;
                display: block;
                opacity: 0;
                transition: opacity 0.4s ease;
            }

            .blog-iframe.loaded {
                opacity: 1;
            }
        </style>

        <!-- Favicon -->
        <link rel="icon" href="favicon.ico" />
    </head>
    <body>
        <div class="iframe-container">
            <!-- Material Green Loading Screen -->
            <div id="loading" class="loading-screen">
                <div class="loading-text">Please wait...</div>
                <div class="linear-progress" role="progressbar" aria-label="Loading blog content">
                    <div class="bar"></div>
                </div>
            </div>

            <!-- Borderless Full-Screen iFrame -->
            <iframe
                id="blogFrame"
                class="blog-iframe"
                src="https://poragblog.42web.io"
                title="Abdur Nur Porag Blog"
                frameborder="0"
                onload="hideLoader()"
            ></iframe>
        </div>

        <script>
            let loaderHidden = false;

            function hideLoader() {
                if (loaderHidden) return;
                loaderHidden = true;

                const loader = document.getElementById('loading');
                const iframe = document.getElementById('blogFrame');

                if (loader && iframe) {
                    loader.style.opacity = '0';
                    loader.style.visibility = 'hidden';
                    iframe.classList.add('loaded');
                }
            }

            // Safety Fallback: Hides loader automatically after 4 seconds if the iframe gets blocked
            setTimeout(function() {
                if (!loaderHidden) {
                    hideLoader();
                }
            }, 4000);
        </script>
    </body>
</html>
